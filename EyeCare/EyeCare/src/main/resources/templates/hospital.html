<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>병원 찾기</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<header>
  <div>
    <a onclick="location.href='/index'" class="logo-link" style="cursor:pointer;">EyeCare</a>
  </div>
  <div class="header-buttons">
    <button class="header-btn" onclick="location.href='/login'">로그인</button>
    <button class="header-btn" onclick="location.href='/register'">회원가입</button>
  </div>
</header>

<main class="hospital-page">
  <div class="search-header">
    <h2 style="margin:0;">내 주변 병원 찾기</h2>
    <select id="search-input">
      <option value="병원">병원</option>
      <option value="약국">약국</option>
      <option value="안과">안과</option>
      <option value="한의원">한의원</option>
    </select>
    <button id="search-btn">검색</button>
  </div>

  <div class="info-panel" id="info-panel">
    <button id="close-panel">&times;</button>
    <h3 id="info-title"></h3>
    <p id="info-address"></p>
    <a id="info-url" href="#" target="_blank">카카오 장소 보기</a>
  </div>

  <div id="map"></div>
</main>


<!-- ✅ 최신 네이버 지도 API v3 로드 (ncpKeyId로 교체 필수) -->
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=2qj8lppskw&callback=initMap"></script>

<!-- ✅ 인증 실패 시 안내 -->
<script>
  let currentLocation = null;
  let map = null;
  let markers = [];

  function initMap() {
    map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(37.5665, 126.9780),
      zoom: 14
    });

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function (position) {
        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;
        const userLocation = new naver.maps.LatLng(userLat, userLng);

        map.setCenter(userLocation);
        currentLocation = { lat: userLat, lng: userLng };

        new naver.maps.Marker({
          position: userLocation,
          map: map,
          title: "내 위치"
        });
      });
    }
  }

  function clearMarkers() {
    markers.forEach(m => m.setMap(null));
    markers = [];
  }

  function searchNearbyHospitals() {
    const keyword = document.getElementById("search-input").value.trim() || "병원";
    if (!currentLocation) {
      alert("위치 정보를 아직 가져오지 못했습니다.");
      return;
    }

    // 🔑 Kakao REST API Key 직접 삽입 (보안상 위험하나 임시 대응용)
    const kakaoApiKey = "KakaoAK d540cb060e7363318363b3813278082c";
    const url = `https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(keyword)}&x=${currentLocation.lng}&y=${currentLocation.lat}&radius=3000`;

    fetch(url, {
      method: "GET",
      headers: {
        Authorization: kakaoApiKey
      }
    })
            .then(res => {
              if (!res.ok) throw new Error("API 호출 실패");
              return res.json();
            })
            .then(data => {
              clearMarkers();

              data.documents.forEach(doc => {
                const lat = parseFloat(doc.y);
                const lng = parseFloat(doc.x);
                const name = doc.place_name;
                const placeUrl = doc.place_url; // ✅ 카카오 장소 페이지 URL

                const marker = new naver.maps.Marker({
                  position: new naver.maps.LatLng(lat, lng),
                  map: map,
                  icon: {
                    content: `<div style="background:#0095ff;width:12px;height:12px;border-radius:50%;border:2px solid white;"></div>`,
                    size: new naver.maps.Size(14, 14),
                    anchor: new naver.maps.Point(7, 7)
                  },
                  title: name
                });

                // 🔹 마커 클릭 시 정보 패널 띄우기
                naver.maps.Event.addListener(marker, "click", function() {
                  const panel = document.getElementById("info-panel");
                  const title = document.getElementById("info-title");
                  const address = document.getElementById("info-address");
                  const url = document.getElementById("info-url");

                  title.textContent = name;
                  address.textContent = doc.road_address_name || doc.address_name;
                  url.href = placeUrl;

                  panel.style.display = "block";

                  // 내 위치 → 마커까지 경로 표시
                  if(currentLocation) {
                    drawRoute(currentLocation, {lat, lng});
                  }
                });

                markers.push(marker);
              });
            })
            .catch(err => {
              alert("장소 검색 중 오류 발생: " + err.message);
            });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById("search-btn").addEventListener("click", searchNearbyHospitals);
  });
</script>

</body>
</html>
